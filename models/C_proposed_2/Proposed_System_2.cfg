SecExitBranch NextComponentList { EcoOutSecurity  PrioOutSecurity }
SecExitBranch Choice { this.obj.PaxClass }

# *** EntityConveyor ***

WalkToEcoCheckIn NextComponent { EcoInCheckInQ }
