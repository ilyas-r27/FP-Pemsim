PassengerLogger DataSource { { this.obj.PaxClass } { 'this.obj.tArrive/1[min]' } { '(this.SimTime - this.obj.tArrive)/1[min]' } { '(this.obj.tInCIQ - this.obj.tArrive)/1[min]' } { '(this.obj.tOutCI - this.obj.tInCIQ)/1[min]' } { '(this.obj.tInSecQ - this.obj.tOutCI)/1[min]' } { '(this.obj.tOutSec - this.obj.tInSecQ)/1[min]' } { '(this.obj.tInGateQ - this.obj.tOutSec)/1[min]' } { '(this.SimTime - this.obj.tInGateQ)/1[min]' } }
