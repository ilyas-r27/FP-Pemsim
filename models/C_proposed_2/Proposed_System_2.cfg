# *** Assign ***

AssignPaxClass NextComponent { ArrivalLogger }
AssignPaxClass AttributeAssignmentList { { 'this.obj.PaxClass = [PaxClassDist].Value' } { 'this.obj.tArrive = this.SimTime' } }

# --- Logging timestamps (zero-time, do not change model behaviour) ---

EcoInCheckInQ NextComponent { EcoCheckInQueue }
EcoInCheckInQ AttributeAssignmentList { { 'this.obj.tInCIQ = this.SimTime' } }

EcoOutCheckIn NextComponent { WalkToEcoSecurity }
EcoOutCheckIn AttributeAssignmentList { { 'this.obj.tOutCI = this.SimTime' } }

EcoInSecurityQ NextComponent { EcoSecurityQueue }
EcoInSecurityQ AttributeAssignmentList { { 'this.obj.tInSecQ = this.SimTime' } }

EcoOutSecurity NextComponent { WalkToLounge }
EcoOutSecurity AttributeAssignmentList { { 'this.obj.tOutSec = this.SimTime' } }

PrioInCheckInQ NextComponent { PrioCheckInQueue }
PrioInCheckInQ AttributeAssignmentList { { 'this.obj.tInCIQ = this.SimTime' } }

PrioOutCheckIn NextComponent { WalkToPrioSecurity }
PrioOutCheckIn AttributeAssignmentList { { 'this.obj.tOutCI = this.SimTime' } }

PrioInSecurityQ NextComponent { PrioSecurityQueue }
